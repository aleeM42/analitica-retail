[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
dependencies = [
  "pandas>=3.0.6",
  "duckdb>=1.5.6",
  "statsmodels>=0.14.0",
  "scipy >=1.11.0",
  "pymc >=5.10.0",
  "pymc-marketing >=0.8.0",
]
name = "retailventure_dss"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
