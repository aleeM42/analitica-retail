[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retailventure_dss"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=3.0.6",
  "numpy>=2.0",
  "duckdb>=1.5.6",
  "pydantic>=2.5",
  "typeguard>=4.0",
  "statsmodels>=0.14.0",
  "scipy>=1.11.0",
]

[project.optional-dependencies]
viz = [
  "plotly>=5.18",
  "dash>=2.14",
  "matplotlib>=3.8",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]